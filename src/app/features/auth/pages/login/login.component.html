<div class="login-container d-flex align-items-center justify-content-center vh-100 bg-light">
  <div class="card shadow-sm" style="width: 100%; max-width: 400px; border-radius: 12px;">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <h2 class="fw-bold text-primary">Mokatta System</h2>
        <p class="text-muted">Login to continue</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Email Input -->
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-control" formControlName="email" placeholder="admin@mokatta.com"
            [ngClass]="{'is-invalid': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}">
          <div class="invalid-feedback">
            Enter a valid email, please.
          </div>
        </div>

        <!-- Password Input -->
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" formControlName="password" placeholder="••••••••"
            [ngClass]="{'is-invalid': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}">
          <div class="invalid-feedback">
            Password must be at least 6 characters long.
          </div>
        </div>


        <!-- Submit Button -->
        <div class="d-grid">
          <button type="submit" class="btn btn-primary py-2" [disabled]="isLoading()">
            @if (isLoading()) {
              <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            }
            {{ isLoading() ? 'Logging in...' : 'Login' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
